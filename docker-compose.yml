services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reactor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reactor}
      POSTGRES_DB: ${POSTGRES_DB:-reactor}
    volumes:
      - dbdata:/var/lib/postgresql/data

  server:
    build: ./server
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  dbdata: